name: keepalive

on:
  schedule:
    - cron: '17 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .keepalive
          git config user.name "keepalive"
          git config user.email "keepalive@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive"
          git push
