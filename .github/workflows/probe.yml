name: probe

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force_fail:
        description: 'Симулировать падение (тест алерта)'
        type: boolean
        default: false

permissions:
  issues: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: proba
        id: p
        env:
          HOST: ${{ secrets.PROBE_HOST }}
          FORCE_FAIL: ${{ inputs.force_fail }}
        run: |
          status=fail
          detail="нет ответа"
          if [ "$FORCE_FAIL" = "true" ]; then
            detail="принудительный тест"
          else
            i=1
            while [ $i -le 3 ]; do
              out=$(curl -sS --max-time 12 -o /dev/null -w '%{http_code} %{time_total}' "https://${HOST}/") || out="000 0"
              code=$(echo "$out" | cut -d' ' -f1)
              secs=$(echo "$out" | cut -d' ' -f2)
              if [ "$code" = "200" ]; then
                status=ok
                detail="HTTP 200 за ${secs} c"
                break
              fi
              detail="попытка ${i}: код ${code}"
              i=$((i+1))
              if [ $i -le 3 ]; then sleep 20; fi
            done
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "detail=$detail" >> "$GITHUB_OUTPUT"

      - name: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT_ID }}
          STATUS: ${{ steps.p.outputs.status }}
          DETAIL: ${{ steps.p.outputs.detail }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          tg() {
            curl -sS --max-time 20 -o /dev/null \
              "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT}" \
              -d disable_web_page_preview=true \
              --data-urlencode text="$1"
          }
          num=$(gh issue list --state open --limit 50 --json number,title \
                --jq '.[] | select(.title=="PROBE-DOWN") | .number' | head -n1)
          now=$(TZ=Europe/Moscow date '+%d.%m.%Y %H:%M МСК')
          if [ "$STATUS" = "fail" ]; then
            if [ -z "$num" ]; then
              gh issue create --title "PROBE-DOWN" --body "Первая неудачная проба: ${now}
Детали: ${DETAIL}
Лог: ${RUN_URL}"
              tg "🔴 443/tcp не отвечает
Время: ${now}
Детали: ${DETAIL}
Проба идёт из сети GitHub, не из РФ."
            fi
          else
            if [ -n "$num" ]; then
              gh issue comment "$num" --body "${now} — восстановлен (${DETAIL})"
              gh issue close "$num"
              tg "🟢 443/tcp снова отвечает
Время: ${now}
Детали: ${DETAIL}"
            fi
          fi
